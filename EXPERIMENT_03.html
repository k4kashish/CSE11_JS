<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>EXPERIMENT 03</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f2f2f2;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.2);
        }

        input {
            padding: 8px;
            width: 80%;
            margin: 10px 0;
        }

        button {
            padding: 8px 12px;
            margin: 5px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>

</head>
<body>

    <div class="container">
        <h1 id="heading">Welcome to JavaScript Lab</h1>

        <input type="text" id="inputText" placeholder="Enter new heading text">

        <div class="buttons">
            <button onclick="changeHeading()">Change Heading</button>
            <button onclick="changeBackground()">Change Background</button>
            <button onclick="increaseFont()">Increase Font Size</button>
        </div>

        <div class="buttons">
            <button onclick="toggleParagraph()">Show/Hide Paragraph</button>
            <button onclick="resetPage()">Reset</button>
        </div>

        <p id="para">
            This is a sample paragraph. JavaScript events can dynamically change content.
        </p>
    </div>

    <script src="EXPERIMENT_03.js"></script>
</body>
</html>
